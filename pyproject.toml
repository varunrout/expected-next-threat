[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expected-next-threat"
version = "0.1.0.dev0"
description = "A live, calibrated next-action engine for SkillCorner tracking data: where the ball and the danger go next."
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Varun Rout" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
expected_next_threat = ["pretrained/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the SkillCorner open data download"]
